# PREPARATION ONLY. Explicit ZONE paths only, never a shared log wildcard.
/var/log/zone-staging/fpm-error.log /var/log/zone-staging/fpm-access.log {
    daily
    rotate 7
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    sharedscripts
    postrotate
        /bin/systemctl kill --kill-who=main --signal=USR1 zone-staging-fpm.service >/dev/null 2>&1 || true
    endscript
}
/var/log/nginx/zone-staging-engine-access.log /var/log/nginx/zone-staging-engine-error.log /var/log/nginx/zone-staging-gateway-access.log /var/log/nginx/zone-staging-gateway-error.log {
    daily
    rotate 7
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        # The installed Ubuntu nginx rotate policy must be reviewed first.
        # Reopening logs is not restarting the shared nginx service.
        /bin/systemctl kill --kill-who=main --signal=USR1 nginx.service >/dev/null 2>&1 || true
    endscript
}
