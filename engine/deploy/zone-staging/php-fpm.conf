; PREPARATION ONLY. Independent master; never include a shared pool directory.
[global]
pid = /run/zone-staging/php-fpm.pid
error_log = /var/log/zone-staging/fpm-error.log
log_level = warning
log_limit = 2048
daemonize = no
emergency_restart_threshold = 3
emergency_restart_interval = 1m
process_control_timeout = 10s
include = /etc/zone-staging/php-pool.conf
