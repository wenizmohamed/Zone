# PREPARATION ONLY. Snippet for ONE approved existing TLS server{}.
# No listen/server_name/TLS change, and no overwrite of an existing location.
# Its origin has no trailing slash: https://APPROVED_ENGINE_HOST/zone-staging-gateway
location ^~ /zone-staging-gateway/ {
    client_max_body_size 1m;
    client_body_timeout 10s;
    access_log /var/log/nginx/zone-staging-gateway-access.log zone_staging;
    error_log /var/log/nginx/zone-staging-gateway-error.log warn;
    proxy_pass http://127.0.0.1:55437/;
    proxy_http_version 1.1;
    # A non-control transport Host prevents an external request from becoming
    # the relay's privileged localhost shutdown command via this proxy.
    proxy_set_header Host zone-staging-gateway.invalid;
    proxy_set_header Connection "";
    # Never manufacture or replace X-Zone-Relay-Key, client metadata or owner
    # proof. api/index.php sends them; the Node relay validates/strips them.
    proxy_pass_request_headers on;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 20s;
    proxy_read_timeout 22s;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
