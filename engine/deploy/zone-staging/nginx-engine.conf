# PREPARATION ONLY. New HTTP adapter consumed by the existing HTTP Node relay.
# Include in http{} only after independently approved setup and nginx -t.
server {
    listen 127.0.0.1:54301;
    server_name 127.0.0.1;
    server_tokens off;
    access_log /var/log/nginx/zone-staging-engine-access.log zone_staging;
    error_log /var/log/nginx/zone-staging-engine-error.log warn;
    client_max_body_size 1m;
    client_body_timeout 10s;

    location / {
        allow 127.0.0.1;
        deny all;
        # Do not derive a script filename from any request path.
        fastcgi_pass unix:/run/zone-staging/php-fpm.sock;
        fastcgi_pass_request_headers off;
        fastcgi_param SCRIPT_FILENAME /srv/zone-staging/current/engine/router.php;
        fastcgi_param SCRIPT_NAME /engine/router.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param SERVER_SOFTWARE nginx;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_NAME 127.0.0.1;
        fastcgi_param SERVER_ADDR 127.0.0.1;
        fastcgi_param SERVER_PORT 54301;
        fastcgi_param DOCUMENT_ROOT /srv/zone-staging/current;
        # Router authenticates this socket peer BEFORE adopting signed client IP.
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_ZONE_GATEWAY_KEY $http_x_zone_gateway_key;
        fastcgi_param HTTP_X_ZONE_GATEWAY_HOST $http_x_zone_gateway_host;
        fastcgi_param HTTP_X_ZONE_GATEWAY_PROTO $http_x_zone_gateway_proto;
        fastcgi_param HTTP_X_ZONE_GATEWAY_IP $http_x_zone_gateway_ip;
        fastcgi_param HTTP_X_ZONE_GATEWAY_OWNER $http_x_zone_gateway_owner;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_REFERER $http_referer;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_X_ZONE_PLAYER_ID $http_x_zone_player_id;
        fastcgi_param HTTP_X_ZONE_PLAYER_TOKEN $http_x_zone_player_token;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 18s;
        fastcgi_request_buffering on;
        fastcgi_next_upstream off;
    }
}
