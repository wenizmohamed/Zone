; PREPARATION ONLY. Dedicated workers and FastCGI socket, no public TCP FPM.
[zone-staging]
user = zone-engine-staging
group = zone-engine-staging
listen = /run/zone-staging/php-fpm.sock
listen.owner = zone-engine-staging
listen.group = www-data
listen.mode = 0660
listen.backlog = 32
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300
chdir = /srv/zone-staging/current
clear_env = yes
env[VERCEL] = 1
env[ZONE_PLAYER_SESSIONS] = 1
env[ZONE_DATABASE_URL] = $ZONE_DATABASE_URL
env[ZONE_ENGINE_RELAY_KEY] = $ZONE_ENGINE_RELAY_KEY
env[ZONE_ENGINE_PUBLIC_HOSTS] = $ZONE_ENGINE_PUBLIC_HOSTS
; Owner credentials remain in Vercel. Only a verified relay owner proof crosses.
; No Redis URL, legacy founder identity or direct owner token is imported.
security.limit_extensions = .php
catch_workers_output = yes
decorate_workers_output = yes
access.log = /var/log/zone-staging/fpm-access.log
access.format = "%t %m %s %{milliseconds}d %{megabytes}M"
request_terminate_timeout = 16s
request_terminate_timeout_track_finished = yes
rlimit_files = 2048
rlimit_core = 0
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 15
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[session.save_path] = /var/lib/zone-staging/sessions
php_admin_value[upload_tmp_dir] = /var/lib/zone-staging/tmp
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.jit] = 0
php_admin_value[opcache.jit_buffer_size] = 0
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[opcache.enable] = on
php_admin_value[error_log] = /proc/self/fd/2
