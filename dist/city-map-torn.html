<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zone City Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#map{height:100%;width:100%}
  body{background:#0b0e13;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
  .mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{opacity:.35}
  .mapboxgl-ctrl-group{background:#161b22;border:1px solid rgba(255,255,255,.12)}
  .mapboxgl-ctrl-group button+button{border-top:1px solid rgba(255,255,255,.1)}
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{filter:invert(.85)}

  /* colored pin marker (Torn style) + white icon */
  .zbadge{position:relative;cursor:pointer;outline:none;will-change:transform}
  .zbadge:focus-visible .zpin{box-shadow:0 0 0 3px rgba(49,224,255,.7);border-radius:50%}
  .zpin{position:relative;width:26px;height:32px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8));transition:transform .12s ease;display:block}
  .zbadge:hover .zpin,.zbadge.sel .zpin{transform:translateY(-3px) scale(1.12)}
  .zbadge.sel .zpin::after{content:"";position:absolute;left:1px;top:1px;width:24px;height:24px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 10px var(--c,#31e0ff);pointer-events:none}
  .zlbl{position:absolute;top:33px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:#dfe6ee;background:rgba(12,16,22,.82);padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
  .zbadge.dim{opacity:.25}
  .zhere{width:16px;height:16px;border-radius:50%;background:#31e0ff;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(12,16,22,.6),0 0 12px rgba(49,224,255,.7)}
  .zhere::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(49,224,255,.6);animation:zpulse 1.8s ease-out infinite}
  @keyframes zpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}

  .ui-search{position:absolute;top:12px;left:12px;z-index:5;width:210px}
  .ui-search input{width:100%;background:rgba(20,24,30,.92);border:1px solid rgba(255,255,255,.16);color:#eef3f8;border-radius:8px;padding:8px 30px 8px 12px;font:inherit;font-size:12px;outline:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .ui-search input:focus{border-color:#31e0ff}
  .ui-results{margin-top:4px;background:rgba(18,22,28,.98);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.5);display:none}
  .ui-results.on{display:block}
  .ui-results button{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:none;border:0;color:#dfe6ee;font:inherit;font-size:12px;padding:7px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
  .ui-results button:hover{background:rgba(49,224,255,.12)}
  .ui-results .dot{width:9px;height:9px;border-radius:2px;flex:none}
  .ui-chips{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:58%}
  .ui-chips button{background:rgba(20,24,30,.9);border:1px solid rgba(255,255,255,.16);color:#c7d0da;border-radius:20px;padding:5px 11px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .12s}
  .ui-chips button .dot{width:9px;height:9px;border-radius:3px}
  .ui-chips button.off{opacity:.4}
  .zlegend{position:absolute;bottom:14px;left:12px;z-index:5;background:rgba(18,22,28,.9);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 10px;color:#e7ecf2;font-size:11px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .zlegend .ttl{font-weight:700;margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:#9fb0c2}
  .zlegend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .zlegend .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.5);flex:none}
  .panel{position:absolute;top:0;right:0;bottom:0;width:250px;max-width:78%;z-index:9;background:rgba(14,18,24,.97);border-left:1px solid rgba(255,255,255,.12);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.7,.3,1);box-shadow:-10px 0 30px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:16px}
  .panel.on{transform:translateX(0)}
  .panel .x{position:absolute;top:10px;right:12px;background:none;border:0;color:#8b97a8;font-size:20px;cursor:pointer;line-height:1}
  .panel .pico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px;background:radial-gradient(circle,rgba(255,255,255,.1) 40%,transparent 72%)}
  .panel .pico svg{width:34px;height:34px}
  .panel h2{color:#f1f5fa;font-size:18px;font-weight:700;margin-bottom:2px}
  .panel .pcat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  .panel .go{margin-top:auto;background:linear-gradient(#31e0ff,#1aa9c9);color:#04222b;font-weight:800;border:0;border-radius:9px;padding:12px;font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 14px rgba(49,224,255,.3)}
  .zerr{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#5a1f1f;color:#ffdede;border:1px solid #a33;border-radius:8px;padding:8px 12px;font-size:12px;display:none}
  [dir="rtl"] .ui-search{left:auto;right:12px}
  [dir="rtl"] .ui-chips{right:auto;left:12px;justify-content:flex-start}
  [dir="rtl"] .zlegend{left:auto;right:12px}
  [dir="rtl"] .panel{right:auto;left:0;border-left:0;border-right:1px solid rgba(255,255,255,.12);transform:translateX(-105%)}
  [dir="rtl"] .panel.on{transform:translateX(0)}
  @media (max-width:560px){.ui-search{width:150px}.ui-chips{max-width:44%}.panel{top:auto;left:0;right:0;width:100%;max-width:100%;height:auto;transform:translateY(105%);border-left:0;border-top:1px solid rgba(255,255,255,.12);flex-direction:row;align-items:center;gap:12px;padding:12px}.panel.on{transform:translateY(0)}.panel .go{margin-top:0;margin-left:auto;padding:10px 16px}.panel .pcat{margin-bottom:0}}
</style>
</head>
<body>
<div id="map"></div>
<div class="ui-search"><input id="search" type="text" placeholder="Search places..." aria-label="Search places" autocomplete="off"><div class="ui-results" id="results"></div></div>
<div class="ui-chips" id="chips"></div>
<div class="zlegend" id="legend" hidden><div class="ttl" id="legendTtl">Key of Symbols</div><div id="legendRows"></div></div>
<div class="panel" id="panel" role="dialog" aria-label="Location details"><button class="x" id="panelX" aria-label="Close">&times;</button><div class="pico" id="pIco"></div><h2 id="pName"></h2><div class="pcat" id="pCat"></div><button class="go" id="pGo"></button></div>
<div class="zerr" id="err"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.js"></script>
<script>
(function(){
  "use strict";
  var TOKEN="pk.eyJ1Ijoid2VuaW1vaGFtZWQiLCJhIjoiY211YnlhcmtnMDdxYTJ6czVmMThoZTY0YiJ9.3eATNhlNNEJDCJPGNDx-LA";
  if(!window.mapboxgl){ document.getElementById('err').textContent='Mapbox GL failed to load'; document.getElementById('err').style.display='block'; return; }
  mapboxgl.accessToken=TOKEN;
  // Zone City = a dense grid metropolis. Fictional labels off later; dark noir cartography now.
  var CENTER=[-73.9812,40.7562], Z=15;
  var SPAN_LNG=0.021, SPAN_LAT=0.012;   // pins spread across the opening view
  function ll(x,y){ return [CENTER[0]+(x/100-0.5)*SPAN_LNG, CENTER[1]+(0.5-y/100)*SPAN_LAT]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var map=new mapboxgl.Map({
    container:'map', style:'mapbox://styles/mapbox/standard',
    center:CENTER, zoom:Z, minZoom:12.5, maxZoom:18, pitch:55, bearing:-18,
    config:{ basemap:{ lightPreset:'night', showPlaceLabels:false, showRoadLabels:false, showPointOfInterestLabels:false, showTransitLabels:false } },
    attributionControl:false, cooperativeGestures:false, dragRotate:true
  });
  map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'top-left');
  map.addControl(new mapboxgl.AttributionControl({compact:true}));
  map.on('error',function(e){ try{ var m=(e&&e.error&&e.error.message)||''; if(/access token|401|403|Unauthorized/i.test(m)){ var el=document.getElementById('err'); el.textContent='Map tiles blocked: '+m; el.style.display='block'; } }catch(_){}} );

  var markers=[], hereMk=null, selected=null, activeCats=null, lastData=null, lang='en';
  var el={search:document.getElementById('search'),results:document.getElementById('results'),chips:document.getElementById('chips'),
    legend:document.getElementById('legend'),legendTtl:document.getElementById('legendTtl'),legendRows:document.getElementById('legendRows'),
    panel:document.getElementById('panel'),pName:document.getElementById('pName'),pCat:document.getElementById('pCat'),pGo:document.getElementById('pGo'),pIco:document.getElementById('pIco'),panelX:document.getElementById('panelX')};
  var T={search:'Search places...',travel:'Travel here'}, TAR={search:'ابحث عن مكان...',travel:'السفر إلى هنا'};

  function fico(p,size,fill){ return '<svg viewBox="0 0 512 512" width="'+size+'" height="'+size+'" fill="'+fill+'"><path d="'+esc(p.d)+'"></path></svg>'; }
  function pinSvg(p){
    return '<svg viewBox="0 0 34 42" width="26" height="32">'
      +'<path d="M17 1C8.7 1 2 7.7 2 16c0 10.5 15 25 15 25s15-14.5 15-25C32 7.7 25.3 1 17 1z" fill="'+esc(p.color)+'" stroke="rgba(0,0,0,.5)" stroke-width="1"></path>'
      +'<circle cx="17" cy="15.5" r="11" fill="rgba(255,255,255,.18)"></circle>'
      +'<g transform="translate(8,6.5) scale(0.0352)" fill="#fff">'+(p.d?'<path d="'+esc(p.d)+'"></path>':'')+'</g></svg>';
  }
  function selectPin(m){
    if(selected&&selected._el) selected._el.classList.remove('sel');
    selected=m; m._el.classList.add('sel');
    var p=m._zp;
    el.pName.textContent=p.label; el.pCat.textContent=p.catLabel||''; el.pCat.style.color=p.color;
    el.pIco.innerHTML=fico(p,34,p.color);
    el.pGo.textContent=(lang==='ar'?TAR.travel:T.travel);
    el.pGo.onclick=function(){ if(p.screen) parent.postMessage({zoneGo:p.screen,MARKER_CLICK:p.id,v:1},'*'); };
    el.panel.classList.add('on');
    map.flyTo({center:m.getLngLat(),zoom:Math.max(map.getZoom(),16.2),duration:700,essential:true});
  }
  function deselect(){ if(selected&&selected._el) selected._el.classList.remove('sel'); selected=null; el.panel.classList.remove('on'); }
  el.panelX.onclick=deselect;
  map.on('click',deselect);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') deselect(); });

  function applyFilter(){ markers.forEach(function(m){ var on=!activeCats||activeCats.has(m._zp.cat); m._el.classList.toggle('dim',!on); }); }

  function clearMarkers(){ markers.forEach(function(m){m.remove();}); markers=[]; if(hereMk){hereMk.remove();hereMk=null;} }

  function render(data){
    lastData=data; clearMarkers();
    var pins=data.zonePins||[], legend=data.legend||[], catLabel={};
    legend.forEach(function(g){catLabel[g.cat]=g.label;});
    activeCats=new Set(legend.map(function(g){return g.cat;}));
    pins.forEach(function(p){
      p.catLabel=catLabel[p.cat]||'';
      var d=document.createElement('div'); d.className='zbadge'; d.tabIndex=0; d.setAttribute('role','button'); d.setAttribute('aria-label',p.label); d.style.cssText='--c:'+p.color;
      d.innerHTML='<span class="zpin">'+pinSvg(p)+'</span><span class="zlbl">'+esc(p.label)+'</span>';
      var m=new mapboxgl.Marker({element:d,anchor:'bottom'}).setLngLat(ll(p.x,p.y)).addTo(map);
      m._zp=p; m._el=d; p._m=m;
      d.addEventListener('click',function(ev){ ev.stopPropagation(); selectPin(m); });
      d.addEventListener('keydown',function(k){ if(k.key==='Enter'||k.key===' '){ k.preventDefault(); selectPin(m); } });
      markers.push(m);
    });
    if(data.here){ var h=document.createElement('div'); h.className='zhere'; hereMk=new mapboxgl.Marker({element:h,anchor:'center'}).setLngLat(ll(data.here.x,data.here.y)).addTo(map); }
    // chips
    el.chips.innerHTML='';
    legend.forEach(function(g){
      var b=document.createElement('button'); b.innerHTML='<span class="dot" style="background:'+esc(g.color)+'"></span>'+esc(g.label); b.setAttribute('aria-pressed','true');
      b.onclick=function(){ if(activeCats.has(g.cat))activeCats.delete(g.cat); else activeCats.add(g.cat); b.classList.toggle('off',!activeCats.has(g.cat)); applyFilter(); };
      el.chips.appendChild(b);
    });
    // legend
    if(legend.length){ el.legend.hidden=false; el.legendTtl.textContent=data.legendTitle||'Key of Symbols';
      el.legendRows.innerHTML=legend.map(function(g){return '<div class="row"><span class="sw" style="background:'+esc(g.color)+'"></span>'+esc(g.label)+'</div>';}).join(''); }
    // search
    var idx=pins.slice();
    function closeR(){ el.results.classList.remove('on'); el.results.innerHTML=''; }
    el.search.oninput=function(){ var q=(el.search.value||'').trim().toLowerCase(); if(!q){closeR();return;}
      var hits=idx.filter(function(p){return (p.label||'').toLowerCase().indexOf(q)>=0;}).slice(0,6); if(!hits.length){closeR();return;}
      el.results.innerHTML=''; hits.forEach(function(p){ var b=document.createElement('button'); b.innerHTML='<span class="dot" style="background:'+esc(p.color)+'"></span>'+esc(p.label);
        b.onclick=function(){ el.search.value=p.label; closeR(); if(p._m){ map.flyTo({center:p._m.getLngLat(),zoom:16.5,duration:700,essential:true}); selectPin(p._m); } }; el.results.appendChild(b); });
      el.results.classList.add('on'); };
    el.search.onkeydown=function(e){ if(e.key==='Enter'){var f=el.results.querySelector('button'); if(f)f.click();} if(e.key==='Escape'){el.search.value='';closeR();} };
    applyFilter();
    if(data.lang){ lang=data.lang; el.search.placeholder=(lang==='ar'?TAR.search:T.search); }
    if(data.dir){ document.documentElement.dir=data.dir; }
    setTimeout(function(){ map.resize(); },80);
  }

  window.addEventListener('message',function(e){ var d=e.data; if(!d||typeof d!=='object') return;
    if(d.type==='ON_SHOW'){ setTimeout(function(){map.resize();},60); return; }
    if(d.type==='FLY_TO'&&d.id&&lastData){ var p=(lastData.zonePins||[]).find(function(x){return x.id===d.id;}); if(p&&p._m){ map.flyTo({center:p._m.getLngLat(),zoom:16.5,duration:700}); selectPin(p._m);} return; }
    if(d.zonePins||d.legend||d.here) render(d);
  });
  window.addEventListener('resize',function(){ map.resize(); });
  map.on('load',function(){ map.resize(); });

  function announce(){ try{ parent.postMessage({zoneMapReady:1,v:1},'*'); }catch(_){} }
  if(map.loaded()) announce(); else map.on('load',announce);
  setTimeout(announce,600); setTimeout(announce,1500);
})();
</script>
</body>
</html>
