<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zone City Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%}
  body{background:#080b12;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden;color:#e7ecf2}
  .wrap{display:flex;height:100%;width:100%}

  /* ---- MapGenie-style location sidebar (completionist control-room) ---- */
  .side{width:256px;flex:none;background:#0d131c;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:6}

  /* U5.4 - live SVG completion ring + real count readout */
  .sHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
  .sHtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sHead .t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9fb0c2}
  .scount{font-size:10px;font-weight:800;letter-spacing:.06em;color:#6f7d9c}
  .ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
  .ring .rbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3.5}
  .ring .rfg{fill:none;stroke:#31e0ff;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:97.4;stroke-dashoffset:97.4;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px rgba(49,224,255,.7))}
  .ring .rpct{transform:rotate(90deg);transform-origin:20px 20px;fill:#f4f7ff;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central}
  .ring.done .rfg{stroke:#f2c14e;filter:drop-shadow(0 0 6px rgba(242,193,78,.9))}

  .sSearch{position:relative;padding:10px 12px 4px}
  .sSearch input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#eef3f8;border-radius:8px;padding:8px 30px 8px 11px;font:inherit;font-size:12px;outline:none}
  .sSearch input:focus{border-color:#31e0ff}
  .sClear{position:absolute;top:16px;right:20px;width:20px;height:20px;border:0;background:rgba(255,255,255,.1);color:#c3ccd6;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
  [dir="rtl"] .sClear{right:auto;left:20px}

  /* U5.6 - hide-found filter row + result count */
  .sFilter{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px;gap:8px}
  .fchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#b7c4de;border-radius:20px;padding:5px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .fchip[aria-pressed="true"]{background:rgba(49,224,255,.14);border-color:#31e0ff;color:#7defff}
  .fdot{width:8px;height:8px;border-radius:2px;border:1.5px solid currentColor}
  .fchip[aria-pressed="true"] .fdot{background:#31e0ff;border-color:#31e0ff}
  .fres{font-size:10px;color:#6f7d9c;font-weight:700}
  .side.nofound .loc.found{display:none}

  .cats{flex:1;overflow-y:auto;padding:2px 6px 14px}
  .cats::-webkit-scrollbar{width:8px}.cats::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .zempty{padding:24px 14px;text-align:center;color:#6f7d9c;font-size:12px;font-weight:600}
  .cat{margin:2px 0}
  .catHead{position:relative;flex-wrap:wrap;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
  .catHead:hover{background:rgba(255,255,255,.05)}
  .catHead .eye{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--c);background:var(--c);box-shadow:0 0 6px var(--c);transition:all .12s}
  .cat.hid .catHead .eye{background:transparent;box-shadow:none}
  .catHead .cname{flex:1;font-size:12.5px;font-weight:600;color:#dbe3ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat.hid .catHead .cname{opacity:.45}
  .catHead .ccount{font-size:10px;font-weight:700;color:#8b97a8;background:rgba(255,255,255,.06);padding:1px 7px;border-radius:20px}
  .catHead .chev{font-size:9px;color:#6b7688;transition:transform .15s}
  .cat.open .catHead .chev{transform:rotate(90deg)}
  /* U4.16 - per-category mini progress bar */
  .cbar{flex-basis:100%;height:3px;margin-top:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .cbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--c);box-shadow:0 0 5px var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .cat.done .cbar i{background:#f2c14e;box-shadow:0 0 6px #f2c14e}
  .cat.done .ccount{color:#f2c14e}
  /* U4.20 - animated expand/collapse via grid-rows */
  .clist{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.3,1)}
  .cat.open .clist{grid-template-rows:1fr}
  .clistInner{overflow:hidden;min-height:0;padding:2px 0 6px 10px}
  .loc{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:#c3ccd6}
  .loc:hover{background:rgba(49,224,255,.1);color:#fff}
  .cat.open .loc{animation:rowIn .26s ease backwards;animation-delay:calc(var(--ri,0)*26ms)}
  @keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  [dir="rtl"] .cat.open .loc{animation-name:rowInR}
  @keyframes rowInR{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
  .loc .chk{width:15px;height:15px;flex:none;border:1.5px solid rgba(255,255,255,.3);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#04222b;transition:background .18s,border-color .18s,transform .18s}
  .loc.found .chk{background:#31e0ff;border-color:#31e0ff}
  .loc.found .chk::after{content:"\2713";font-weight:900}
  .loc.found .chk{animation:none}
  .loc.found .chk.pop{animation:chkPop .32s cubic-bezier(.34,1.56,.64,1)}
  @keyframes chkPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .loc .ldot{width:8px;height:8px;border-radius:2px;flex:none}
  .loc.found .lname{text-decoration:line-through;opacity:.5}
  .loc .lname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc.hide{display:none}

  /* ---- map column ---- */
  .mapcol{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0}
  /* U4.13 - cinematic fog + player-anchored key-light + wet sheen */
  .mgrade{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    background:radial-gradient(ellipse 60% 45% at var(--lx,50%) var(--ly,40%), rgba(49,224,255,.10) 0%, rgba(49,224,255,0) 46%),
               radial-gradient(ellipse 120% 100% at 50% 52%, rgba(6,11,20,0) 50%, rgba(6,11,20,.62) 100%),
               linear-gradient(180deg, rgba(8,14,24,.30) 0%, rgba(8,14,24,0) 22%)}
  .mgrade::after{content:"";position:absolute;inset:-10% 0;background:linear-gradient(180deg,rgba(49,224,255,.05) 0%,rgba(49,224,255,0) 42%);opacity:.55;animation:wet 6.5s ease-in-out infinite}
  @keyframes wet{0%,100%{transform:translateY(-2%)}50%{transform:translateY(2%)}}
  .mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{opacity:.3}
  .mapboxgl-ctrl-group{background:#161b22;border:1px solid rgba(255,255,255,.12)}
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{filter:invert(.85)}

  /* ---- markers / pins (MapGenie-grade balloon) ---- */
  .zbadge{position:relative;cursor:pointer;outline:none;will-change:transform}
  /* U4.14 - grounded contact shadow that stays down when the pin lifts */
  .zbadge::before{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:20px;height:6px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 72%);z-index:-1;transition:transform .12s ease,opacity .12s ease;pointer-events:none}
  .zbadge:hover::before,.zbadge.sel::before{transform:translateX(-50%) scale(.8);opacity:.65}
  /* U4.12/U4.13/U4.15 - MapGenie pin: 30x38, ground shadow, no glow */
  .zpin{position:relative;width:30px;height:38px;transform-origin:50% 100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));transition:transform .12s ease;display:block;
    animation:zIn .55s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--d,0)*1ms)}
  @keyframes zIn{0%{opacity:0;transform:translateY(-20px) scale(.35)}55%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1)}}
  .zbadge:hover .zpin,.zbadge.sel .zpin{transform:translateY(-3px) scale(1.14)}
  /* U4.15 - selected = the one licensed cyan key-light */
  .zbadge.sel .zpin::after{content:"";position:absolute;left:1px;top:1px;width:28px;height:28px;border-radius:50%;border:2.5px solid #7defff;box-shadow:0 0 0 2px rgba(4,34,43,.6),0 0 14px 2px rgba(49,224,255,.75);pointer-events:none}
  /* U5.8 - sonar landing ping */
  .zbadge.png .zpin::before{content:"";position:absolute;left:1px;top:1px;width:28px;height:28px;border-radius:50%;border:2px solid var(--c,#31e0ff);animation:zping .85s cubic-bezier(.2,.7,.3,1);pointer-events:none}
  @keyframes zping{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.6);opacity:0}}
  /* U4.18 - found = grey-ghost + on-map cyan-green check badge */
  .zbadge.isfound .zpin{filter:grayscale(.7) brightness(.75) drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .zbadge.isfound::after{content:"\2713";position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:#41e08a;color:#04220f;font-size:10px;font-weight:900;display:grid;place-items:center;border:1.5px solid #0d131c;box-shadow:0 0 5px rgba(65,224,138,.7);z-index:2}
  [dir="rtl"] .zbadge.isfound::after{right:auto;left:-3px}

  /* U5.9 / U4.10 / U3.23 - hover/focus/select-gated preview label */
  .zlbl{position:absolute;top:39px;left:50%;opacity:0;pointer-events:none;
    transform:translateX(-50%) translateY(4px) scale(.94);transform-origin:top center;
    transition:opacity .15s ease, transform .15s cubic-bezier(.2,.7,.3,1);
    display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:#eaf1f8;
    background:rgba(10,15,22,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    padding:3px 8px 3px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--c,#31e0ff)}
  [dir="rtl"] .zlbl{border-left:1px solid rgba(255,255,255,.1);border-right:3px solid var(--c,#31e0ff)}
  .zlbl .lcat{color:#8fa0ba;font-weight:600;font-size:8.5px}
  .zbadge:hover .zlbl,.zbadge:focus-visible .zlbl,.zbadge.sel .zlbl{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* U4.22 - low-zoom cluster bubble */
  .zclus{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#0f2b3a,#0d1220);border:2px solid #31e0ff;color:#7defff;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 0 12px rgba(49,224,255,.4);cursor:pointer}

  .zhere{width:16px;height:16px;border-radius:50%;background:#31e0ff;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(12,16,22,.6),0 0 12px rgba(49,224,255,.7)}
  .zhere::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(49,224,255,.6);animation:zpulse 1.8s ease-out infinite}
  @keyframes zpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}

  /* U5.10 - travel ETA/cost HUD */
  .etaHud{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;display:flex;gap:14px;background:rgba(14,18,24,.94);border:1px solid rgba(49,224,255,.35);border-radius:10px;padding:9px 14px;box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:12px;font-weight:700;color:#c3ccd6}
  .etaHud b{color:#31e0ff;font-weight:800}

  /* U4.17 - location detail card */
  .panel{position:absolute;top:0;right:0;bottom:0;width:260px;max-width:80%;z-index:9;background:rgba(14,18,24,.97);border-left:1px solid rgba(255,255,255,.12);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.7,.3,1);box-shadow:-10px 0 30px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:16px;overflow:hidden}
  .panel.on{transform:translateX(0)}
  .panel .x{position:absolute;top:10px;right:12px;background:none;border:0;color:#8b97a8;font-size:20px;cursor:pointer;line-height:1;z-index:3}
  [dir="rtl"] .panel .x{right:auto;left:12px}
  .pribbon{position:absolute;top:16px;right:-34px;transform:rotate(45deg);background:linear-gradient(#41e08a,#2fae6f);color:#04220f;font-size:10px;font-weight:900;letter-spacing:.1em;padding:3px 40px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:2}
  .panel.isfound .pribbon{display:block}
  [dir="rtl"] .pribbon{right:auto;left:-34px;transform:rotate(-45deg)}
  .panel .pico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px;background:radial-gradient(circle,rgba(255,255,255,.1) 40%,transparent 72%)}
  .panel .pico svg{width:34px;height:34px}
  .panel h2{color:#f1f5fa;font-size:18px;font-weight:700;margin-bottom:2px}
  .panel .pcat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .pmeta{font-size:11px;color:#8493b3;margin:0 0 14px;font-weight:600;min-height:14px}
  .panel .go{margin-top:auto;background:linear-gradient(#31e0ff,#1aa9c9);color:#04222b;font-weight:800;border:0;border-radius:9px;padding:12px;font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 14px rgba(49,224,255,.3)}
  .panel .mark{margin-top:8px;background:rgba(255,255,255,.06);color:#c7d0da;border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px;font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
  .panel .mark.burst{animation:mkburst .45s ease}
  @keyframes mkburst{0%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(65,224,138,.25)}100%{transform:scale(1)}}

  .sideToggle{display:none}
  .zerr{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#5a1f1f;color:#ffdede;border:1px solid #a33;border-radius:8px;padding:8px 12px;font-size:12px;display:none}

  /* U4.21 - branded first-load reveal overlay */
  .zboot{position:absolute;inset:0;z-index:15;background:#080b12;display:grid;place-items:center;opacity:1;transition:opacity .6s ease}
  .zboot.gone{opacity:0;pointer-events:none}
  .zbootMark{width:34px;height:34px;border-radius:50%;border:2px solid rgba(49,224,255,.25);border-top-color:#31e0ff;animation:zspin .8s linear infinite;box-shadow:0 0 18px rgba(49,224,255,.35)}
  @keyframes zspin{to{transform:rotate(360deg)}}

  [dir="rtl"] .side{border-right:0;border-left:1px solid rgba(255,255,255,.08)}
  [dir="rtl"] .clistInner{padding:2px 10px 6px 0}
  [dir="rtl"] .panel{right:auto;left:0;border-left:0;border-right:1px solid rgba(255,255,255,.12);transform:translateX(-105%)}
  [dir="rtl"] .panel.on{transform:translateX(0)}
  /* U4.19 - RTL chevron mirror */
  [dir="rtl"] .catHead .chev{transform:scaleX(-1)}
  [dir="rtl"] .cat.open .catHead .chev{transform:scaleX(-1) rotate(90deg)}
  [dir="rtl"] .loc,[dir="rtl"] .catHead{direction:rtl}

  /* U4.19 - focus rings */
  .catHead:focus-visible,.loc:focus-visible,.fchip:focus-visible,.eye:focus-visible,.zbadge:focus-visible{outline:2px solid #31e0ff;outline-offset:2px;border-radius:6px}

  /* U4.19 - mobile drawer backdrop */
  .sideBd{position:absolute;inset:0;background:rgba(3,4,10,.55);backdrop-filter:blur(2px);z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
  @media (max-width:640px){
    .side{position:absolute;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .25s;box-shadow:6px 0 24px rgba(0,0,0,.5)}
    .side.open{transform:translateX(0)}
    .side.open~.sideBd,.sideBd.on{opacity:1;pointer-events:auto}
    .sideToggle{display:grid;place-items:center;position:absolute;top:10px;left:10px;z-index:7;width:38px;height:38px;background:#161b22;border:1px solid rgba(255,255,255,.16);border-radius:9px;color:#31e0ff;font-size:18px;cursor:pointer}
    [dir="rtl"] .sideToggle{left:auto;right:10px}
    .panel{width:100%;max-width:100%}
  }

  /* U3.24 - reduced-motion guard */
  @media (prefers-reduced-motion:reduce){
    .zpin,.loc,.zboot .zbootMark,.zhere::before,.zbadge.png .zpin::before,.mgrade::after,.loc.found .chk.pop{animation:none!important}
    .zboot{transition:none}
    .zpin{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side">
    <div class="sHead">
      <div class="sHtxt"><span class="t" id="sTitle">Locations</span><span class="scount" id="scount">0 / 0</span></div>
      <svg class="ring" id="ring" viewBox="0 0 40 40"><circle class="rbg" cx="20" cy="20" r="15.5"/><circle class="rfg" id="rfg" cx="20" cy="20" r="15.5"/><text class="rpct" id="rpct" x="20" y="20">0%</text></svg>
    </div>
    <div class="sSearch"><input id="search" type="text" placeholder="Search..." aria-label="Search places" autocomplete="off"><button class="sClear" id="sClear" aria-label="Clear search" hidden>&times;</button></div>
    <div class="sFilter"><button class="fchip" id="fHide" aria-pressed="false"><span class="fdot"></span><span id="fHideT">Hide found</span></button><span class="fres" id="fRes"></span></div>
    <div class="cats" id="cats"></div>
    <div class="zempty" id="zempty" hidden>No places match</div>
  </aside>
  <div class="mapcol">
    <button class="sideToggle" id="sideToggle" aria-label="Locations">&#9776;</button>
    <div id="map"></div>
    <div class="mgrade"></div>
    <div class="etaHud" id="etaHud" hidden></div>
    <div class="panel" id="panel" role="dialog" aria-label="Location details">
      <button class="x" id="panelX" aria-label="Close">&times;</button>
      <span class="pribbon" id="pRib">FOUND</span>
      <div class="pico" id="pIco"></div>
      <h2 id="pName"></h2>
      <div class="pcat" id="pCat"></div>
      <div class="pmeta" id="pMeta"></div>
      <button class="go" id="pGo"></button>
      <button class="mark" id="pMark"></button>
    </div>
    <div class="zerr" id="err"></div>
    <div class="zboot" id="zboot"><div class="zbootMark"></div></div>
    <div class="sideBd" id="sideBd"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.js"></script>
<script>
(function(){
  "use strict";
  var TOKEN="pk.eyJ1Ijoid2VuaW1vaGFtZWQiLCJhIjoiY211YnlhcmtnMDdxYTJ6czVmMThoZTY0YiJ9.3eATNhlNNEJDCJPGNDx-LA";
  if(!window.mapboxgl){ var e0=document.getElementById('err'); e0.textContent='Mapbox GL failed to load'; e0.style.display='block'; return; }
  mapboxgl.accessToken=TOKEN;
  var CENTER=[-73.9812,40.7562], Z=15, SPAN_LNG=0.021, SPAN_LAT=0.012;
  function ll(x,y){ return [CENTER[0]+(x/100-0.5)*SPAN_LNG, CENTER[1]+(0.5-y/100)*SPAN_LAT]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

  var map=new mapboxgl.Map({ container:'map', style:'mapbox://styles/mapbox/standard',
    center:CENTER, zoom:Z, minZoom:12.5, maxZoom:18, pitch:55, bearing:-18,
    config:{ basemap:{ lightPreset:'night', showPlaceLabels:false, showRoadLabels:false, showPointOfInterestLabels:false, showTransitLabels:false } },
    attributionControl:false, dragRotate:true });
  map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'top-right');
  map.addControl(new mapboxgl.AttributionControl({compact:true}));
  map.on('error',function(e){ try{ var m=(e&&e.error&&e.error.message)||''; if(/token|401|403|Unauthorized/i.test(m)){ var el=document.getElementById('err'); el.textContent='Map tiles blocked: '+m; el.style.display='block'; } }catch(_){}} );

  var markers=[], mById={}, hereMk=null, hereLL=null, selected=null, activeCats={}, lastData=null, lang='en';
  var found; try{ found=new Set(JSON.parse(localStorage.getItem('zoneFound')||'[]')); }catch(_){ found=new Set(); }

      map.addLayer({id:'zroute-line',type:'line',source:'zroute',layout:{'line-cap':'round'},paint:{'line-color':'#7defff','line-width':2.6,'line-dasharray':[0,2.4]}});
    } }catch(_){}
  });

  var userIx=false, idleT=null;
  ['mousedown','touchstart','wheel','dragstart','zoomstart','rotatestart','pitchstart'].forEach(function(ev){ map.on(ev,function(){ userIx=true; if(idleT)clearTimeout(idleT); idleT=setTimeout(function(){ userIx=false; },4500); }); });
  /* U3.24 - idle-orbit breathing + player-anchored key-light tracking */
  var t0=performance.now();
  function orbit(now){
    if(!userIx){ try{ map.setBearing(map.getBearing()+0.02); map.setPitch(60+Math.sin((now-t0)/9000)*2.2); }catch(_){} }
    if(hereLL){ try{ var pt=map.project(hereLL); document.querySelector('.mgrade').style.setProperty('--lx',pt.x+'px'); document.querySelector('.mgrade').style.setProperty('--ly',pt.y+'px'); }catch(_){} }
    requestAnimationFrame(orbit);
  }
  map.on('load',function(){ map.resize();
    if(!RM){ try{ map.easeTo({pitch:60,bearing:-26,zoom:15.4,duration:2800,essential:true}); }catch(_){} setTimeout(function(){ requestAnimationFrame(orbit); },3200); }
    else { requestAnimationFrame(orbit); }
    /* U4.21 - boot overlay fallback so it never hangs */
    setTimeout(function(){ if(el.zboot) el.zboot.classList.add('gone'); },4000);
  });

  function announce(){ try{ parent.postMessage({zoneMapReady:1,v:1},'*'); }catch(_){} }
  if(map.loaded()) announce(); else map.on('load',announce);
  setTimeout(announce,700); setTimeout(announce,1600);
})();
</script>
