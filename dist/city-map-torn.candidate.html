<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zone City Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;width:100%}
  body{background:#080b12;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden;color:#e7ecf2}
  .wrap{position:relative;display:flex;height:100%;width:100%}

  /* ---- MapGenie-style location sidebar (completionist control-room) ---- */
  .side{position:absolute;inset:0 auto 0 0;width:272px;max-width:86vw;background:rgba(13,19,28,.985);border-right:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;z-index:40;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.7,.3,1);box-shadow:8px 0 30px rgba(0,0,0,.46)}
  .side.open{transform:translateX(0)}

  /* U5.4 - live SVG completion ring + real count readout */
  .sHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
  .sideClose{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.07);color:#f0f5fa;font:inherit;font-size:24px;line-height:1;cursor:pointer}
  .sideClose:hover{background:rgba(49,224,255,.14);border-color:#31e0ff}
  .sHtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sHead .t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9fb0c2}
  .scount{font-size:10px;font-weight:800;letter-spacing:.06em;color:#6f7d9c}
  .ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
  .ring .rbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3.5}
  .ring .rfg{fill:none;stroke:#31e0ff;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:97.4;stroke-dashoffset:97.4;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px rgba(49,224,255,.7))}
  .ring .rpct{transform:rotate(90deg);transform-origin:20px 20px;fill:#f4f7ff;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central}
  .ring.done .rfg{stroke:#f2c14e;filter:drop-shadow(0 0 6px rgba(242,193,78,.9))}

  .modeTabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px 10px 3px}
  .modeTab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(255,255,255,.035);color:#aeb9cb;padding:7px 6px;font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.035em;cursor:pointer}
  .modeTab[aria-selected="true"]{color:#eef5ff;border-color:rgba(49,224,255,.46);background:linear-gradient(180deg,rgba(49,224,255,.15),rgba(49,224,255,.055));box-shadow:inset 0 0 0 1px rgba(49,224,255,.05)}
  .modeTab svg{width:14px;height:14px}

  .sSearch{position:relative;padding:10px 12px 4px}
  .sSearch input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#eef3f8;border-radius:8px;padding:8px 11px;padding-inline-end:45px;font:inherit;font-size:12px;outline:none}
  .sSearch input:focus{border-color:#31e0ff}
  .sClear{position:absolute;top:12px;right:13px;width:32px;height:32px;border:0;background:rgba(255,255,255,.1);color:#e3eaf2;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
  [dir="rtl"] .sClear{right:auto;left:13px}

  /* U5.6 - hide-found filter row + result count */
  .sFilter{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px;gap:8px}
  .fchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#b7c4de;border-radius:20px;padding:5px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .fchip[aria-pressed="true"]{background:rgba(49,224,255,.14);border-color:#31e0ff;color:#7defff}
  .fdot{width:8px;height:8px;border-radius:2px;border:1.5px solid currentColor}
  .fchip[aria-pressed="true"] .fdot{background:#31e0ff;border-color:#31e0ff}
  .fres{font-size:10px;color:#6f7d9c;font-weight:700}
  .side.nofound .loc.found{display:none}

  .cats,.territories{flex:1;overflow-y:auto;padding:2px 6px 14px}
  .cats::-webkit-scrollbar{width:8px}.cats::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .territories::-webkit-scrollbar{width:8px}.territories::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .territories[hidden],.cats[hidden]{display:none}
  .terr{--tc:#8a8f94;position:relative;margin:5px 2px;padding:9px 9px 9px 12px;border:1px solid rgba(255,255,255,.09);border-left:3px solid var(--tc);border-radius:8px;background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 12%,transparent),rgba(255,255,255,.025));cursor:pointer;overflow:hidden}
  [dir="rtl"] .terr{padding:9px 12px 9px 9px;border-left:1px solid rgba(255,255,255,.09);border-right:3px solid var(--tc)}
  .terr:hover,.terr.sel{border-color:color-mix(in srgb,var(--tc) 72%,white);background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 20%,transparent),rgba(255,255,255,.045))}
  .terrTop{display:flex;align-items:center;gap:8px}
  .terrCrest{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:7px;color:#fff;background:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 24%,transparent)}
  .terrCrest svg{width:15px;height:15px}
  .terrName{min-width:0;flex:1;color:#eef3f8;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .terrState{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--tc);padding:2px 5px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);border-radius:20px}
  .terr.contested .terrState{color:#ff8b70;border-color:#ff6c4c;background:rgba(255,75,44,.1)}
  .terrOwner{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 5px;color:#8290a7;font-size:9.5px;font-weight:700}
  .terrBar{height:4px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}.terrBar i{display:block;height:100%;background:var(--tc);box-shadow:0 0 7px var(--tc)}
  .terrHere{position:absolute;right:4px;bottom:3px;color:#31e0ff;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
  [dir="rtl"] .terrHere{right:auto;left:4px}
  .terr.neutral{--tc:#727b88}.terr.neutral .terrState{color:#b7c0cb}
  .terr.eligible{box-shadow:inset 0 0 0 1px rgba(185,241,58,.2)}
  .terr.adjacent::after{content:"";position:absolute;inset:2px;border:1px dashed rgba(125,239,255,.7);border-radius:6px;pointer-events:none}
  .terrCode{color:#64738a;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .zempty{padding:24px 14px;text-align:center;color:#6f7d9c;font-size:12px;font-weight:600}
  .cat{margin:2px 0}
  .catHead{position:relative;flex-wrap:wrap;display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
  .catHead:hover{background:rgba(255,255,255,.05)}
  .catHead .eye{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--c);background:var(--c);box-shadow:0 0 6px var(--c);transition:all .12s}
  .cat.hid .catHead .eye{background:transparent;box-shadow:none}
  .catHead .cname{flex:1;font-size:12.5px;font-weight:600;color:#dbe3ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat.hid .catHead .cname{opacity:.45}
  .catHead .ccount{font-size:10px;font-weight:700;color:#8b97a8;background:rgba(255,255,255,.06);padding:1px 7px;border-radius:20px}
  .catHead .chev{font-size:9px;color:#6b7688;transition:transform .15s}
  .cat.open .catHead .chev{transform:rotate(90deg)}
  /* U4.16 - per-category mini progress bar */
  .cbar{flex-basis:100%;height:3px;margin-top:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .cbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--c);box-shadow:0 0 5px var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .cat.done .cbar i{background:#f2c14e;box-shadow:0 0 6px #f2c14e}
  .cat.done .ccount{color:#f2c14e}
  /* U4.20 - animated expand/collapse via grid-rows */
  .clist{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.3,1)}
  .cat.open .clist{grid-template-rows:1fr}
  .clistInner{overflow:hidden;min-height:0;padding:2px 0 6px 10px}
  .loc{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:#c3ccd6}
  .loc:hover{background:rgba(49,224,255,.1);color:#fff}
  .cat.open .loc{animation:rowIn .26s ease backwards;animation-delay:calc(var(--ri,0)*26ms)}
  @keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  [dir="rtl"] .cat.open .loc{animation-name:rowInR}
  @keyframes rowInR{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
  .loc .chk{width:15px;height:15px;flex:none;border:1.5px solid rgba(255,255,255,.3);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#04222b;transition:background .18s,border-color .18s,transform .18s}
  .loc.found .chk{background:#31e0ff;border-color:#31e0ff}
  .loc.found .chk::after{content:"\2713";font-weight:900}
  .loc.found .chk{animation:none}
  .loc.found .chk.pop{animation:chkPop .32s cubic-bezier(.34,1.56,.64,1)}
  @keyframes chkPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .loc .ldot{width:8px;height:8px;border-radius:2px;flex:none}
  .loc.found .lname{text-decoration:line-through;opacity:.5}
  .loc .lname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc.hide{display:none}

  /* ---- map column ---- */
  .mapcol{flex:1;position:relative;min-width:0;overflow:hidden}
  #map{position:absolute;inset:0}
  /* U4.13 - cinematic fog + player-anchored key-light + wet sheen */
  .mgrade{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    background:radial-gradient(ellipse 60% 45% at var(--lx,50%) var(--ly,40%), rgba(49,224,255,.13) 0%, rgba(49,224,255,0) 46%),
               radial-gradient(ellipse 120% 100% at 50% 52%, rgba(6,11,20,0) 50%, rgba(6,11,20,.62) 100%),
               linear-gradient(180deg, rgba(8,14,24,.30) 0%, rgba(8,14,24,0) 22%)}
  .mgrade::after{content:"";position:absolute;inset:-10% 0;background:linear-gradient(180deg,rgba(49,224,255,.05) 0%,rgba(49,224,255,0) 42%);opacity:.55}
  /* U6.8 - filmic scanline crush over the base map (anti "digital-clean" tell) */
  .mgrade::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.4}
  /* U6.8 - fractal film grain: wet, lived-in noir instead of a clean street map */
  .mapcol::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  /* U6.6 - focus mode: spotlight the selected block, pull the rest of the city back */
  .mapcol.focus .mgrade{background:radial-gradient(ellipse 42% 34% at var(--lx,50%) var(--ly,45%),rgba(49,224,255,.14) 0%,rgba(49,224,255,0) 44%),radial-gradient(ellipse 120% 100% at 50% 52%,rgba(6,11,20,0) 34%,rgba(6,11,20,.8) 100%)!important;transition:background .5s ease}
  .mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{opacity:.3}
  .mapboxgl-ctrl-group{background:#161b22;border:1px solid rgba(255,255,255,.12)}
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{filter:invert(.85)}
  .tMapLabel{width:164px;pointer-events:none;text-align:center;color:#f7fbff;text-shadow:0 1px 2px #02050a,0 0 7px #02050a,0 0 12px #02050a;transition:opacity .18s ease}
  .tMapLabel .tn{display:block;font-size:13px;font-weight:850;line-height:1.2}
  .tMapLabel .tf{display:block;margin-top:2px;font-size:11px;font-weight:750;line-height:1.2;color:#e1e9f3}
  .tMapLabel .tb{display:block;margin-top:1px;font-size:10px;font-weight:800;line-height:1.2;color:var(--tc,#c8d1db)}
  [dir="rtl"] .tMapLabel{font-family:Tahoma,Arial,sans-serif;direction:rtl}
  body[data-mode="places"] .tMapLabel{opacity:.56}

  /* ---- territory-bound POI tokens ---- */
  .zbadge{position:absolute;display:block;width:34px;height:34px;cursor:pointer;outline:none;will-change:transform;transition:opacity .16s ease}
  body[data-mode="territories"] .zbadge{display:none}
  .zbadge::before{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:22px;height:7px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 72%);z-index:-1;transition:transform .12s ease,opacity .12s ease;pointer-events:none}
  .zbadge:hover::before,.zbadge.sel::before{transform:translateX(-50%) scale(.76);opacity:.62}
  .zpin{position:relative;width:34px;height:34px;transform-origin:50% 50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.65));transition:transform .12s ease;display:block;
    animation:zIn .55s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--d,0)*1ms)}
  @keyframes zIn{0%{opacity:0;transform:scale(.35)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
  .zbadge:hover .zpin,.zbadge.sel .zpin{transform:scale(1.16)}
  .zbadge.sel .zpin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #7defff;box-shadow:0 0 0 2px rgba(4,34,43,.65),0 0 13px 1px rgba(49,224,255,.62);pointer-events:none}
  .zbadge.png .zpin::before{content:"";position:absolute;inset:1px;border-radius:50%;border:2px solid var(--tc,#31e0ff);animation:zping .85s cubic-bezier(.2,.7,.3,1);pointer-events:none}
  @keyframes zping{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.6);opacity:0}}
  /* U4.18 - found = grey-ghost + on-map cyan-green check badge */
  .zbadge.isfound .zpin{filter:grayscale(.7) brightness(.75) drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .zbadge.isfound::after{content:"\2713";position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:#41e08a;color:#04220f;font-size:10px;font-weight:900;display:grid;place-items:center;border:1.5px solid #0d131c;box-shadow:0 0 5px rgba(65,224,138,.7);z-index:2}
  [dir="rtl"] .zbadge.isfound::after{right:auto;left:-3px}

  /* U5.9 / U4.10 / U3.23 - hover/focus/select-gated preview label */
  .zlbl{position:absolute;top:37px;left:50%;opacity:0;pointer-events:none;
    transform:translateX(-50%) translateY(4px) scale(.94);transform-origin:top center;
    transition:opacity .15s ease, transform .15s cubic-bezier(.2,.7,.3,1);
    display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:#eaf1f8;
    background:rgba(10,15,22,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    padding:3px 8px 3px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--c,#31e0ff)}
  [dir="rtl"] .zlbl{border-left:1px solid rgba(255,255,255,.1);border-right:3px solid var(--c,#31e0ff)}
  .zlbl .lcat{color:#8fa0ba;font-weight:600;font-size:8.5px}
  .zbadge:hover .zlbl,.zbadge:focus-visible .zlbl,.zbadge.sel .zlbl{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  .zhere{width:16px;height:16px;border-radius:50%;background:#31e0ff;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(12,16,22,.6),0 0 12px rgba(49,224,255,.7)}
  .zhere::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(49,224,255,.6);animation:zpulse 1.8s ease-out infinite}
  @keyframes zpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}

  /* U5.10 - travel ETA/cost HUD */
  .etaHud{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;display:flex;gap:14px;background:rgba(14,18,24,.94);border:1px solid rgba(49,224,255,.35);border-radius:10px;padding:9px 14px;box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:12px;font-weight:700;color:#c3ccd6}
  .etaHud b{color:#31e0ff;font-weight:800}

  /* U4.17 - location detail card */
  .panel{position:absolute;top:0;right:0;bottom:0;width:260px;max-width:80%;z-index:30;background:rgba(14,18,24,.985);border-left:1px solid rgba(255,255,255,.12);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.7,.3,1);box-shadow:-10px 0 30px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:16px;overflow:hidden;pointer-events:none}
  .panel.on{transform:translateX(0)}
  .panel.on{pointer-events:auto}
  .panel .x{position:absolute;top:10px;right:12px;min-width:82px;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;background:#202b36;border:1px solid rgba(255,255,255,.3);border-radius:9px;color:#f5f8fc;font:inherit;font-size:12px;font-weight:800;cursor:pointer;line-height:1;z-index:4}
  .panel .x:hover{background:#284658;border-color:#7defff}
  .panel .xMark{font-size:24px;font-weight:400;line-height:1}
  [dir="rtl"] .panel .x{right:auto;left:12px}
  .pribbon{position:absolute;top:16px;right:-34px;transform:rotate(45deg);background:linear-gradient(#41e08a,#2fae6f);color:#04220f;font-size:10px;font-weight:900;letter-spacing:.1em;padding:3px 40px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:2}
  .panel.isfound .pribbon{display:block}
  .panel.territory .pribbon{display:block;background:linear-gradient(#ff7b5f,#d74a31);color:#2b0904}
  [dir="rtl"] .pribbon{right:auto;left:-34px;transform:rotate(-45deg)}
  .panel .pico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px;background:radial-gradient(circle,rgba(255,255,255,.1) 40%,transparent 72%)}
  .panel .pico svg{width:34px;height:34px}
  .panel h2{color:#f1f5fa;font-size:18px;font-weight:700;margin-bottom:2px}
  .panel .pcat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .pmeta{font-size:11px;color:#8493b3;margin:0 0 14px;font-weight:600;min-height:14px}
  .tOwner{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#9aa8ba;margin:4px 0 9px}.tOwner b{color:#f0f4f8}
  .tControl{display:flex;justify-content:space-between;color:#9aa8ba;margin:0 0 4px}.tControl b{color:#fff}
  .tControlBar{height:7px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:12px}.tControlBar i{display:block;height:100%;border-radius:6px;box-shadow:0 0 9px currentColor}
  .tStats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tStat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:7px}.tStat span{display:block;color:#758399;font-size:8px;text-transform:uppercase;letter-spacing:.06em}.tStat b{display:block;color:#e8eef5;font-size:11px;margin-top:2px}
  .blockStates{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}.blockState{padding:3px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);color:#9cabbc;font-size:8px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.blockState.good{border-color:rgba(185,241,58,.5);color:#b9f13a;background:rgba(185,241,58,.08)}.blockState.info{border-color:rgba(125,239,255,.5);color:#7defff;background:rgba(49,224,255,.08)}.blockState.bad{border-color:rgba(255,115,88,.6);color:#ff8b70;background:rgba(255,115,88,.09)}

  el.mapExpand.onclick=async function(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(error){console.warn('[ZONE map fullscreen]',error);}};
  document.addEventListener('fullscreenchange',function(){
    var expanded=!!document.fullscreenElement;el.mapExpand.setAttribute('aria-pressed',String(expanded));el.mapExpand.setAttribute('aria-label',lang==='ar'?(expanded?'تصغير الخريطة':'توسيع الخريطة'):(expanded?'Collapse map':'Expand map'));el.mapExpand.title=el.mapExpand.getAttribute('aria-label');el.mapExpand.textContent=expanded?'×':'⛶';
    setTimeout(function(){map.resize();},80);
  });

  /* U5.6 - hide-found filter */
  var hideFound=false;
  el.fHide.onclick=function(){ hideFound=!hideFound; this.setAttribute('aria-pressed',hideFound); el.side.classList.toggle('nofound',hideFound); el.fHideT.textContent=L(hideFound?'show':'hide'); };
  /* clear search */
  el.sClear.onclick=function(){ el.search.value=''; el.search.dispatchEvent(new Event('input')); el.search.focus(); };

  function applyCat(){syncPoiSource();}

  function clearAll(){if(selected){try{map.setFeatureState({source:'zone-pois',id:selected.id},{selected:false});}catch(_){}selected=null;}pinData=[];pinById={};hereLL=null;el.cats.innerHTML='';}

  var activeLightPreset='dusk';
  function render(data){
    var selectedPinId=selected&&selected.id;lastData=data;clearAll();
    var pins=Array.isArray(data.zonePins)?data.zonePins:[],legend=data.legend||[],catLabel={},catColor={};
    legend.forEach(function(g){ catLabel[g.cat]=g.label; catColor[g.cat]=g.color; if(activeCats[g.cat]===undefined) activeCats[g.cat]=true; });
    if(data.lang){ lang=data.lang; el.fHideT.textContent=L(hideFound?'show':'hide'); }
    copy=Object.assign({},lang==='ar'?COPY_AR:COPY_EN,data.copy||{});
    if(data.dir) document.documentElement.dir=data.dir;
    el.sideClose.setAttribute('aria-label',lang==='ar'?'أغلق أدوات الخريطة':'Close map controls');el.sideClose.title=el.sideClose.getAttribute('aria-label');
    el.sideToggle.setAttribute('aria-label',lang==='ar'?(el.side.classList.contains('open')?'أغلق أدوات الخريطة':'افتح أدوات الخريطة'):(el.side.classList.contains('open')?'Close map controls':'Open map controls'));
    el.panelX.setAttribute('aria-label',lang==='ar'?'إغلاق التفاصيل':'Close details');el.panelX.querySelector('.xLabel').textContent=lang==='ar'?'إغلاق':'Close';
    var nextLightPreset=data.dark===false?'day':'dusk';
    try{if(map.setConfigProperty&&nextLightPreset!==activeLightPreset){map.setConfigProperty('basemap','lightPreset',nextLightPreset);activeLightPreset=nextLightPreset;}}catch(_){}
    el.modePlaces.querySelector('span').textContent=copy.places; el.modeTerritories.querySelector('span').textContent=copy.territories;
    el.sideToggleText.textContent=mapMode==='places'?copy.places:copy.territories;
    el.cityReset.textContent=copy.fullCity||'Full city';
    el.cityReset.setAttribute('aria-label',copy.fullCity||'Full city');
    el.mapExpand.setAttribute('aria-label',lang==='ar'?(document.fullscreenElement?'تصغير الخريطة':'توسيع الخريطة'):(document.fullscreenElement?'Collapse map':'Expand map'));
    el.streetView.textContent=copy.streetView||'3D city';el.streetView.setAttribute('aria-label',copy.streetViewLabel||'Explore 3D city');
    syncTerritories(data.blocks||[],data);

    /* Ordinary POIs are map-native geometry, never screen-space DOM markers. */
    pinData=pins.map(function(p,i){return normalizePin(p,i,catLabel);});pinData.forEach(function(p){pinById[p.id]=p;});
    hereLL=data.here?pointCoordinates(data.here):null;
    if(selectedPinId&&pinById[selectedPinId])selectPin(pinById[selectedPinId]);

    /* sidebar: category groups with counts + per-category bar + location list */
    legend.forEach(function(g){
      var cp=pinData.filter(function(p){return p.cat===g.cat;});
      var cat=document.createElement('div'); cat.className='cat'; cat.dataset.cat=g.cat; cat.style.cssText='--c:'+g.color;
      if(activeCats[g.cat]===false) cat.classList.add('hid');
      var head=document.createElement('div'); head.className='catHead'; head.tabIndex=0; head.setAttribute('role','button'); head.setAttribute('aria-expanded','false');
      head.innerHTML='<span class="eye" title="toggle"></span><span class="cname">'+esc(g.label)+'</span><span class="ccount">0/'+cp.length+'</span><span class="chev">▸</span><span class="cbar"><i></i></span>';
      cat.appendChild(head);
      var list=document.createElement('div'); list.className='clist'; list.inert=true; list.setAttribute('aria-hidden','true');
      var inner=document.createElement('div'); inner.className='clistInner';
      cp.forEach(function(p,ri){ var row=document.createElement('div'); row.className='loc'+(found.has(p.id)?' found':''); row.dataset.id=p.id; row.dataset.territory=p.territory||''; row.tabIndex=0; row.style.setProperty('--ri',ri); row.style.setProperty('--tc',p.territoryColor||'transparent');
        row.innerHTML='<span class="chk"></span><span class="ldot" style="background:'+esc(p.color)+'"></span><span class="lname">'+esc(p.label)+'</span>';
        row.querySelector('.chk').addEventListener('click',function(ev){ ev.stopPropagation(); setFound(p,!found.has(p.id)); });
        function openLoc(){ var pin=pinById[p.id]; if(pin){ selectPin(pin); closeSide(true); } }
        row.addEventListener('click',openLoc);
        row.addEventListener('keydown',function(k){ if(k.key==='Enter'||k.key===' '){ k.preventDefault(); openLoc(); } });
        inner.appendChild(row); });
      list.appendChild(inner);
      cat.appendChild(list);
      head.addEventListener('click',function(){ setCategoryExpanded(cat,!cat.classList.contains('open')); });
      head.addEventListener('keydown',function(k){ if(k.key==='Enter'||k.key===' '){ k.preventDefault(); head.click(); } });
      head.querySelector('.eye').addEventListener('click',function(ev){ ev.stopPropagation(); activeCats[g.cat]=!activeCats[g.cat]; cat.classList.toggle('hid',!activeCats[g.cat]); applyCat(g.cat); });
      el.cats.appendChild(cat);
    });
    updateProg();

    /* search filters both first-class map modes */
    el.search.oninput=filterSidebar;
    el.search.onkeydown=function(e){
      if(e.key!=='Enter')return;
      e.preventDefault();
      if(mapMode==='territories'){
        var block=Array.from(el.territories.querySelectorAll('.terr')).find(function(row){return row.style.display!=='none';});
        if(block)block.click();
      }else{
        var location=Array.from(el.cats.querySelectorAll('.loc:not(.hide)')).find(function(row){return row.closest('.cat').style.display!=='none';});
        if(location)location.click();
      }
    };

    setMode(mapMode,territoryFilter);
    setTimeout(function(){map.resize();if(!didFit&&Array.isArray(data.blocks)&&data.blocks.length)fitCity(territoryData,false);},80);
    /* U4.21 - fade the boot overlay once pins exist */
    if(el.zboot&&(pins.length||territoryData.length)) el.zboot.classList.add('gone');
  }

  window.addEventListener('message',function(e){ var d=e.data; if(!d||typeof d!=='object') return;
    if(d.type==='ON_SHOW'){setTimeout(function(){map.resize();},60);return;}
    if(d.type==='FLY_TO'&&d.id&&pinById[d.id]){selectPin(pinById[d.id]);return;}
    if(d.zonePins||d.legend||d.here||d.blocks)render(d);
  });
  window.addEventListener('resize',function(){ map.resize(); });

  map.on('click','zone-poi-hitbox',function(e){var f=e.features&&e.features[0],p=f&&pinById[String(f.properties&&f.properties.id)];if(p)selectPin(p);});
  /* U6.5 - hover reveals the marker name at any zoom via feature-state */
  var hoveredPoiId=null;
  map.on('mouseenter','zone-poi-hitbox',function(e){map.getCanvas().style.cursor='pointer';var f=e.features&&e.features[0];if(f&&f.properties){if(hoveredPoiId!=null){try{map.setFeatureState({source:'zone-pois',id:hoveredPoiId},{hover:false});}catch(_){}}hoveredPoiId=String(f.properties.id);try{map.setFeatureState({source:'zone-pois',id:hoveredPoiId},{hover:true});}catch(_){}}});
  map.on('mouseleave','zone-poi-hitbox',function(){map.getCanvas().style.cursor='';if(hoveredPoiId!=null){try{map.setFeatureState({source:'zone-pois',id:hoveredPoiId},{hover:false});}catch(_){}hoveredPoiId=null;}});
  map.on('mouseenter','zone-blocks-fill',function(e){
    map.getCanvas().style.cursor='pointer'; var f=e.features&&e.features[0];
    if(f&&f.id!=null){ hoveredTerritory=f.id; try{map.setFeatureState({source:'zone-blocks',id:f.id},{hover:true});}catch(_){} }
  });
  map.on('mouseleave','zone-blocks-fill',function(){
    map.getCanvas().style.cursor=''; if(hoveredTerritory!=null){try{map.setFeatureState({source:'zone-blocks',id:hoveredTerritory},{hover:false});}catch(_){} hoveredTerritory=null;}
  });

  function installCustomLayers(){
    if(!map.isStyleLoaded())return;
    var ready=map.getLayer('zone-blocks-fill')&&map.getLayer('zone-blocks-ground')&&map.getLayer('zone-blocks-outline')&&map.getLayer('zone-poi-hitbox');
    if(ready)return;
    ensureTerritoryLayers();ensurePoiLayers();
    syncPoiSource();updateAdjacency(selectedTerritory,true);
  }
  map.on('styledata',installCustomLayers);
  map.on('idle',installCustomLayers);
  map.on('style.load',function(){
    /* U4.13 - deeper cinematic fog (crushed base, lower horizon) */
    try{ map.setFog({'range':[2,16],'horizon-blend':0.10,'color':'#18232f','high-color':'#2a6076','space-color':'#0b131d','star-intensity':0.12}); }catch(_){}
    /* U6.9 - hard-lock every real-world label off so no NYC street/place name ever surfaces (kills the "just Mapbox" tell). Fog above is left untouched. */
    try{map.setConfigProperty('basemap','showPointOfInterestLabels',false);map.setConfigProperty('basemap','showTransitLabels',false);map.setConfigProperty('basemap','showRoadLabels',false);map.setConfigProperty('basemap','showPlaceLabels',false);}catch(_){}
    installCustomLayers();
    /* U5.10 - travel route source + glow/line layers */
    try{ if(!map.getSource('zroute')){
      map.addSource('zroute',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
      map.addLayer({id:'zroute-glow',type:'line',source:'zroute',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#31e0ff','line-width':8,'line-blur':7,'line-opacity':.45}});
      map.addLayer({id:'zroute-line',type:'line',source:'zroute',layout:{'line-cap':'round'},paint:{'line-color':'#7defff','line-width':2.6,'line-dasharray':[0,2.4]}});
    } }catch(_){}
  });

  function syncLight(){
    if(hereLL){ try{ var pt=map.project(hereLL); document.querySelector('.mgrade').style.setProperty('--lx',pt.x+'px'); document.querySelector('.mgrade').style.setProperty('--ly',pt.y+'px'); }catch(_){} }
  }
  function recordCamera(){try{var center=map.getCenter();document.body.dataset.zoneCamera=JSON.stringify({lng:center.lng,lat:center.lat,zoom:map.getZoom(),pitch:map.getPitch(),bearing:map.getBearing()});}catch(_){}}
  map.on('moveend',function(){syncLight();recordCamera();});
  map.on('load',function(){ map.resize();
    installCustomLayers();
    syncLight();
    /* U6.10 - slow ambient bearing drift when idle (living city); pauses on any interaction, honors reduced-motion */
    var idleT,drift;
    function stopDrift(){clearTimeout(idleT);cancelAnimationFrame(drift);}
    function armDrift(){if(RM)return;stopDrift();idleT=setTimeout(function loop(){map.easeTo({bearing:map.getBearing()-0.06,duration:120,easing:function(t){return t;}});drift=requestAnimationFrame(function(){idleT=setTimeout(loop,120);});},4000);}
    map.on('movestart',stopDrift);map.on('mousedown',stopDrift);map.on('moveend',armDrift);armDrift();
    /* U4.21 - boot overlay fallback so it never hangs */
    setTimeout(function(){ if(el.zboot) el.zboot.classList.add('gone'); },4000);
  });

  var announced=false,mapInstanceId=Math.random().toString(36).slice(2);
  function announce(){if(announced)return;announced=true;try{parent.postMessage({zoneMapReady:1,mapInstanceId:mapInstanceId,v:1},'*');}catch(_){} }
  if(map.loaded()) announce(); else map.once('load',announce);
  setTimeout(announce,1600);
})();
</script>
</body>
</html>
